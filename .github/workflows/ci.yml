name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: corepack enable
      - run: yarn install --immutable
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: REQUIRE_WASM=1 yarn build:wasm
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn validate:content
      - run: yarn validate:assets
      - run: yarn validate:wiki
      - run: yarn test
      - run: REQUIRE_WASM=1 yarn build
      - run: yarn check:perf
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo test --manifest-path crates/world-core/Cargo.toml
      - run: cargo fmt --manifest-path crates/world-core/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/world-core/Cargo.toml -- -D warnings
