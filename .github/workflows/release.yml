name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown
      - run: corepack enable
      - run: yarn install --immutable
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: REQUIRE_WASM=1 yarn build
      - run: tar -czf alohayo-world-embed-${{ github.ref_name }}.tar.gz -C dist embed assets
      - run: shasum -a 256 alohayo-world-embed-${{ github.ref_name }}.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            alohayo-world-embed-${{ github.ref_name }}.tar.gz
            checksums.txt
