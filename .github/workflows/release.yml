name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown
      - run: corepack enable
      - run: yarn install --immutable
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: REQUIRE_WASM=1 yarn build
      - run: tar -czf alohayo-world-embed-${{ github.ref_name }}.tar.gz -C dist embed assets
      - run: shasum -a 256 alohayo-world-embed-${{ github.ref_name }}.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            alohayo-world-embed-${{ github.ref_name }}.tar.gz
            checksums.txt
